services:
  app:
    restart: unless-stopped
    cpus: ${UNDERLEAF_APP_CPUS:-2}
    mem_limit: ${UNDERLEAF_APP_MEMORY:-4G}
    pids_limit: 512
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  mongo:
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  compiler:
    restart: "no"
