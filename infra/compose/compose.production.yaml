services:
  app:
    ports: !reset []
    restart: unless-stopped
    cpus: ${UNDERLEAF_APP_CPUS:-2}
    mem_limit: ${UNDERLEAF_APP_MEMORY:-4G}
    pids_limit: 512
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      OVERLEAF_SECURE_COOKIE: "true"
      OVERLEAF_TRUSTED_PROXY_IPS: loopback
      SUBNET_RATE_LIMITER_DISABLED: "false"
      OVERLEAF_CSP_ENABLED: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  proxy:
    image: caddy:2.9-alpine
    container_name: underleaf-proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${UNDERLEAF_PROXY_HTTP_PORT:-80}:80"
      - "${UNDERLEAF_PROXY_HTTPS_PORT:-443}:443"
    environment:
      UNDERLEAF_SITE_DOMAIN: ${UNDERLEAF_SITE_DOMAIN:?Set UNDERLEAF_SITE_DOMAIN in .env}
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_data:/data
      - proxy_config:/config
    networks:
      - default
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mongo:
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  compiler:
    restart: unless-stopped

volumes:
  proxy_data:
    name: underleaf_proxy_data
  proxy_config:
    name: underleaf_proxy_config
