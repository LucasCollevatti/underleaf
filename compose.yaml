name: underleaf

services:
  base:
    image: ${UNDERLEAF_BASE_IMAGE:-underleaf/base:local}
    build:
      context: .
      dockerfile: server-ce/Dockerfile-base
    restart: "no"
    entrypoint: ["/bin/true"]

  app:
    image: underleaf/app:local
    build:
      context: .
      dockerfile: server-ce/Dockerfile
      args:
        OVERLEAF_BASE_TAG: ${UNDERLEAF_BASE_IMAGE:-underleaf/base:local}
    container_name: underleaf-app
    restart: unless-stopped
    depends_on:
      base:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      compiler:
        condition: service_healthy
    ports:
      - "${UNDERLEAF_HTTP_PORT:-8080}:80"
    stop_grace_period: 60s
    volumes:
      - app_data:/var/lib/overleaf
      - app_history:/var/lib/overleaf/data/history
      - app_cache:/var/lib/overleaf/data/cache
      - app_templates:/var/lib/overleaf/data/template_files
      - compiler_work:/var/lib/underleaf/compiler:ro
    networks:
      - default
      - app_backend
      - compiler_net
    environment:
      OVERLEAF_APP_NAME: Underleaf
      OVERLEAF_NAV_TITLE: Underleaf
      OVERLEAF_HEADER_IMAGE_URL: /underleaf-logo.png
      NAV_HIDE_POWERED_BY: "true"
      OVERLEAF_SITE_URL: ${UNDERLEAF_SITE_URL:-http://localhost:8080}
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis
      OVERLEAF_SESSION_SECRET: ${UNDERLEAF_SESSION_SECRET:?Set UNDERLEAF_SESSION_SECRET in .env}
      SESSION_SECRET: ${UNDERLEAF_SESSION_SECRET:?Set UNDERLEAF_SESSION_SECRET in .env}
      CRYPTO_RANDOM: ${UNDERLEAF_SESSION_SECRET:?Set UNDERLEAF_SESSION_SECRET in .env}
      ENABLED_LINKED_FILE_TYPES: project_file,project_output_file
      ENABLE_CONVERSIONS: "true"
      EMAIL_CONFIRMATION_DISABLED: "true"
      UNDERLEAF_ALLOW_MONGO_7: "true"
      UNDERLEAF_COMPILE_TIMEOUT: ${UNDERLEAF_COMPILE_TIMEOUT:-3600}
      UNDERLEAF_MAX_PROJECT_SIZE: ${UNDERLEAF_MAX_PROJECT_SIZE:-0}
      UNDERLEAF_TEXLIVE_IMAGE: ${UNDERLEAF_TEXLIVE_IMAGE:-texlive/texlive:latest}
      CLSI_HOST: compiler
      FILESTORE_HOST: app
      FILESTORE_LISTEN_ADDRESS: 0.0.0.0
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:3000/status >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  compiler:
    image: underleaf/compiler:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: server-ce/Dockerfile-compiler
      args:
        UNDERLEAF_COMPILER_BASE_IMAGE: ${UNDERLEAF_BASE_IMAGE:-underleaf/base:local}
        UNDERLEAF_TEXLIVE_IMAGE: ${UNDERLEAF_TEXLIVE_IMAGE:-texlive/texlive:latest}
    depends_on:
      base:
        condition: service_completed_successfully
    user: "www-data:www-data"
    read_only: true
    init: true
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
      - /var/lib/underleaf/compiler/texmf-var:rw,nosuid,size=2g
    cpus: ${UNDERLEAF_COMPILE_CPUS:-4}
    mem_limit: ${UNDERLEAF_COMPILE_MEMORY:-8G}
    pids_limit: 512
    environment:
      HOME: /tmp
      LISTEN_ADDRESS: 0.0.0.0
      FILESTORE_HOST: app
      CLSI_COMPILES_PATH: /var/lib/underleaf/compiler/compiles
      CLSI_OUTPUT_PATH: /var/lib/underleaf/compiler/output
      CLSI_CACHE_PATH: /var/lib/underleaf/compiler/cache
      CLSI_UPLOAD_PATH: /var/lib/underleaf/compiler/uploads
      TEXMFVAR: /var/lib/underleaf/compiler/texmf-var
      UNDERLEAF_COMPILE_TIMEOUT: ${UNDERLEAF_COMPILE_TIMEOUT:-3600}
      UNDERLEAF_MAX_PROJECT_SIZE: ${UNDERLEAF_MAX_PROJECT_SIZE:-0}
    networks:
      - compiler_net
    volumes:
      - compiler_work:/var/lib/underleaf/compiler
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:3013/status >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mongo:
    image: mongo:7.0.43
    container_name: underleaf-mongo
    restart: unless-stopped
    command: ["--replSet", "overleaf", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
      - ./bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js:ro
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      - mongo:127.0.0.1
    networks:
      - app_backend
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep 1'
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:6.2.21-alpine
    container_name: underleaf-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app_backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app_data:
    name: underleaf_app_data
  app_history:
    name: underleaf_app_history
  app_cache:
    name: underleaf_app_cache
  app_templates:
    name: underleaf_app_templates
  compiler_work:
    name: underleaf_compiler_work
  mongo_data:
    name: underleaf_mongo_data
  redis_data:
    name: underleaf_redis_data

networks:
  app_backend:
    name: underleaf_app_backend
    internal: true
  compiler_net:
    name: underleaf_compiler_net
    internal: true
